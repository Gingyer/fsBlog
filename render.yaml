services:
  - type: web
    name: fsblog
    runtime: node
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
